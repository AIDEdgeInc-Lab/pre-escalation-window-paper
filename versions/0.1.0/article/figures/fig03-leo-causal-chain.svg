<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fe3f0"/>
    </marker>
    <marker id="a3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7a82"/>
    </marker>
    <marker id="a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2a83c"/>
    </marker>
  </defs>
  <rect width="1000" height="760" fill="#0b0e10"/>

  <text x="30" y="34" font-size="14" fill="#f2f5f7" font-weight="600">LEO / NTN — changing infrastructure and changing propagation</text>
  <g font-size="11" letter-spacing="0.06em">
    <text x="140" y="62" fill="#f2a83c" text-anchor="middle">DECISION EVIDENCE</text>
    <text x="500" y="62" fill="#7fe3f0" text-anchor="middle">PHYSICAL MECHANISM</text>
    <text x="855" y="62" fill="#a9b4bc" text-anchor="middle">WHAT MONITORING OBSERVES</text>
  </g>

  <!-- physics chain -->
  <g>
    <g fill="rgba(127,227,240,0.08)" stroke="#7fe3f0" stroke-opacity="0.75">
      <rect x="340" y="82" width="320" height="44" rx="6"/>
      <rect x="340" y="146" width="320" height="44" rx="6"/>
      <rect x="340" y="210" width="320" height="44" rx="6"/>
      <rect x="340" y="274" width="320" height="44" rx="6"/>
      <rect x="340" y="338" width="320" height="44" rx="6"/>
      <rect x="340" y="402" width="320" height="44" rx="6"/>
      <rect x="340" y="466" width="320" height="44" rx="6"/>
      <rect x="340" y="530" width="320" height="44" rx="6"/>
      <rect x="340" y="594" width="320" height="44" rx="6"/>
    </g>
    <g font-size="12.5" fill="#f2f5f7" text-anchor="middle">
      <text x="500" y="103">Orbital geometry — the serving satellite moves</text>
      <text x="500" y="167">Elevation ε ↓ · slant range ↑</text>
      <text x="500" y="231">Path loss varies within the pass · slant-path rain, gases</text>
      <text x="500" y="295">Link margin · C/N — partly geometry-explained</text>
      <text x="500" y="359">Link adaptation → throughput</text>
      <text x="500" y="423">Serving satellite / beam state</text>
      <text x="500" y="487">Handover → new geometry, possibly new gateway</text>
      <text x="500" y="551">RTT step · loss burst · capacity share changes</text>
      <text x="500" y="615">Service continuity affected → conventional escalation</text>
    </g>
    <g font-size="10" fill="#6e7a82" text-anchor="middle">
      <text x="500" y="118">550 km · 95.5 min period · 25° elevation mask (modelled parameters)</text>
      <text x="500" y="182">one pass lasts 4.49 min above the mask</text>
      <text x="500" y="246">ITU-R P.618 / P.676 · reduction factors omitted in our model</text>
      <text x="500" y="310">the per-pass arc is HEALTHY — thresholds alarm on it</text>
      <text x="500" y="374">same arc; capacity also depends on beam / satellite share</text>
      <text x="500" y="438">a spacecraft fault exists only while it serves</text>
      <text x="500" y="502">13.4 handovers per terminal per hour in the modelled case</text>
      <text x="500" y="566">expected at a handover boundary; elsewhere, not</text>
      <text x="500" y="630">by which point the evidence may have moved on</text>
    </g>
    <g stroke="#7fe3f0" stroke-width="1.6" marker-end="url(#a3)">
      <line x1="500" y1="126" x2="500" y2="142"/>
      <line x1="500" y1="190" x2="500" y2="206"/>
      <line x1="500" y1="254" x2="500" y2="270"/>
      <line x1="500" y1="318" x2="500" y2="334"/>
      <line x1="500" y1="382" x2="500" y2="398"/>
      <line x1="500" y1="446" x2="500" y2="462"/>
      <line x1="500" y1="510" x2="500" y2="526"/>
      <line x1="500" y1="574" x2="500" y2="590"/>
    </g>
  </g>

  <!-- telemetry column -->
  <g>
    <g fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.12)">
      <rect x="720" y="274" width="255" height="44" rx="6"/>
      <rect x="720" y="338" width="255" height="44" rx="6"/>
      <rect x="720" y="466" width="255" height="44" rx="6"/>
      <rect x="720" y="530" width="255" height="44" rx="6"/>
      <rect x="720" y="594" width="255" height="44" rx="6"/>
    </g>
    <g font-size="12" fill="#f2f5f7">
      <text x="734" y="294">received level, C/N — per-pass arc</text>
      <text x="734" y="358">throughput</text>
      <text x="734" y="486">RTT</text>
      <text x="734" y="550">packet loss</text>
      <text x="734" y="614">per-terminal aggregates</text>
    </g>
    <g font-size="10" fill="#6e7a82">
      <text x="734" y="309">healthy variation that looks like degradation</text>
      <text x="734" y="373">falls without a fault; rises without a repair</text>
      <text x="734" y="501">steps at handover — expected discontinuity</text>
      <text x="734" y="565">short bursts at the same boundaries</text>
      <text x="734" y="629">mix samples taken under different spacecraft</text>
    </g>
    <g stroke="#6e7a82" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a3g)">
      <line x1="662" y1="296" x2="716" y2="296"/>
      <line x1="662" y1="360" x2="716" y2="360"/>
      <line x1="662" y1="488" x2="716" y2="488"/>
      <line x1="662" y1="492" x2="716" y2="552"/>
      <line x1="662" y1="616" x2="716" y2="616"/>
    </g>
  </g>

  <!-- decision column -->
  <g>
    <g fill="rgba(242,168,60,0.08)" stroke="rgba(242,168,60,0.45)">
      <rect x="25" y="274" width="255" height="76" rx="6"/>
      <rect x="25" y="370" width="255" height="76" rx="6"/>
      <rect x="25" y="466" width="255" height="60" rx="6"/>
      <rect x="25" y="546" width="255" height="60" rx="6"/>
    </g>
    <g font-size="12" fill="#ffc978">
      <text x="39" y="294">Remove the geometry-predicted component</text>
      <text x="39" y="390">Condition the baseline on the serving satellite</text>
      <text x="39" y="486">Which correlation group?</text>
      <text x="39" y="566">How much pass time is left?</text>
    </g>
    <g font-size="10" fill="#a9b4bc">
      <text x="39" y="311">before anything is called anomalous —</text>
      <text x="39" y="325">otherwise healthy orbital physics</text>
      <text x="39" y="339">generates an alarm every pass</text>
      <text x="39" y="407">without it a spacecraft fault is smeared</text>
      <text x="39" y="421">across the pass schedule and becomes</text>
      <text x="39" y="435">statistically invisible (F1 0.94 → ≈0.05)</text>
      <text x="39" y="503">terminals sharing a satellite ⇒ space segment;</text>
      <text x="39" y="517">terminals sharing a gateway ⇒ ground segment</text>
      <text x="39" y="583">a hard, geometry-set deadline with no</text>
      <text x="39" y="597">microwave equivalent: can this wait?</text>
    </g>
    <g stroke="#f2a83c" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a3a)">
      <line x1="336" y1="296" x2="284" y2="300"/>
      <line x1="336" y1="424" x2="284" y2="396"/>
      <line x1="336" y1="428" x2="284" y2="490"/>
      <line x1="336" y1="490" x2="284" y2="570"/>
    </g>
  </g>

  <!-- expected-state return -->
  <rect x="25" y="660" width="950" height="58" rx="6" fill="rgba(127,227,240,0.07)" stroke="#7fe3f0" stroke-opacity="0.7" stroke-dasharray="5 4"/>
  <text x="45" y="682" font-size="12.5" fill="#7fe3f0" font-weight="600">EXPECTED-STATE RETURN ↑</text>
  <text x="235" y="682" font-size="12" fill="#f2f5f7">the pass ends · a new spacecraft takes over · the symptom disappears for reasons unrelated to the fault</text>
  <text x="45" y="702" font-size="11" fill="#a9b4bc">Recovery at a handover boundary is not evidence of repair. This is the LEO-specific form of the false calm, and it is why an unconditioned aggregate is not a state.</text>

  <text x="500" y="742" font-size="11" fill="#6e7a82" text-anchor="middle">Conceptual. Doppler, inter-satellite links, beam roll-off and congestion are NOT modelled (Part III.8). No operator data.</text>
</svg>
