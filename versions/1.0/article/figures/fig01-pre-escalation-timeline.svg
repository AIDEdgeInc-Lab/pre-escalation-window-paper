<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8794A0"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#081116"/>

  <!-- lane bands -->
  <rect x="250" y="62" width="310" height="34" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
  <text x="258" y="77" font-size="12" fill="#AAB8C2">FALSE-CALM WINDOW ·<tspan x="258" dy="14" font-size="11">conventional escalation − first detectable</tspan></text>

  <rect x="330" y="102" width="230" height="34" rx="4" fill="rgba(122,174,227,0.16)" stroke="#7AAEE3"/>
  <text x="338" y="117" font-size="12" fill="#99C6F3" font-weight="600">PRE-ESCALATION WINDOW ·<tspan x="338" dy="14" font-size="11" font-weight="400">sign not guaranteed</tspan></text>

  <rect x="250" y="142" width="530" height="34" rx="4" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.10)"/>
  <text x="258" y="157" font-size="12" fill="#AAB8C2">EXPOSURE WINDOW ·<tspan x="258" dy="14" font-size="11">service impact − first detectable</tspan></text>

  <!-- arm lanes -->
  <text x="70" y="206" font-size="11.5" fill="#8794A0" letter-spacing="0.08em">DECISION LAYER</text>
  <line x1="330" y1="202" x2="950" y2="202" stroke="#7AAEE3" stroke-width="2"/>
  <circle cx="330" cy="202" r="5" fill="#7AAEE3"/>
  <text x="342" y="197" font-size="11.5" fill="#99C6F3">actionable — escalate / wait / recommend</text>

  <text x="70" y="240" font-size="11.5" fill="#8794A0" letter-spacing="0.08em">CONVENTIONAL</text>
  <line x1="560" y1="236" x2="950" y2="236" stroke="#AAB8C2" stroke-width="2"/>
  <circle cx="560" cy="236" r="5" fill="#AAB8C2"/>
  <text x="572" y="231" font-size="11.5" fill="#AAB8C2">threshold + persistence + process delay satisfied</text>

  <!-- axis -->
  <line x1="70" y1="286" x2="960" y2="286" stroke="#8794A0" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="960" y="276" font-size="11" fill="#8794A0" text-anchor="end">operational time</text>

  <!-- ticks -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="1">
    <line x1="120" y1="60" x2="120" y2="286"/>
    <line x1="250" y1="60" x2="250" y2="286"/>
    <line x1="330" y1="100" x2="330" y2="286"/>
    <line x1="560" y1="60" x2="560" y2="286"/>
    <line x1="640" y1="140" x2="640" y2="286"/>
    <line x1="780" y1="140" x2="780" y2="286"/>
    <line x1="900" y1="196" x2="900" y2="286"/>
  </g>

  <g font-size="11.5" fill="#F5F7FA">
    <text x="120" y="310" text-anchor="middle">physical onset</text>
    <text x="232" y="332" text-anchor="middle">first detectable</text>
    <text x="352" y="310" text-anchor="middle" fill="#99C6F3">layer actionable</text>
    <text x="560" y="332" text-anchor="middle" fill="#C6A15B">conventional escalation</text>
    <text x="640" y="310" text-anchor="middle">ticket</text>
    <text x="780" y="332" text-anchor="middle">service impact</text>
    <text x="900" y="310" text-anchor="middle">recovery</text>
  </g>

  <g font-size="10.5" fill="#8794A0">
    <text x="120" y="326" text-anchor="middle">t_fault_onset</text>
    <text x="232" y="348" text-anchor="middle">t_first_detectable</text>
    <text x="360" y="326" text-anchor="middle">t_decision_layer_actionable</text>
    <text x="560" y="348" text-anchor="middle">t_conventional_escalation</text>
    <text x="640" y="326" text-anchor="middle">t_ticket</text>
    <text x="780" y="348" text-anchor="middle">t_service_impact</text>
  </g>

  <text x="70" y="378" font-size="10.4" fill="#8794A0">Conceptual. Spacing is illustrative, not to scale. The conventional mark moves with comparator tuning; under a degenerate comparator it can move left of the layer's mark, inverting the window.</text>
  <text x="70" y="40" font-size="13" fill="#F5F7FA" font-weight="600">The interval before escalation — what is instrumented in every run</text>
</svg>
