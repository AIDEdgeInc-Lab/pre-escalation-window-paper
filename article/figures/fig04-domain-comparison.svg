<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7AAEE3"/>
    </marker>
    <marker id="a4w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#AAB8C2"/>
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#081116"/>

  <!-- LEFT PANEL: microwave -->
  <rect x="20" y="20" width="470" height="360" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
  <text x="40" y="48" font-size="12" fill="#7AAEE3" letter-spacing="0.08em">MICROWAVE BACKHAUL</text>
  <text x="40" y="70" font-size="13.5" fill="#F5F7FA" font-weight="600">Fixed infrastructure · changing propagation</text>

  <!-- towers -->
  <g stroke="#AAB8C2" stroke-width="2" fill="none">
    <path d="M90 300 L110 200 L130 300"/>
    <path d="M100 250 L120 250"/>
    <path d="M380 300 L400 200 L420 300"/>
    <path d="M390 250 L410 250"/>
  </g>
  <line x1="60" y1="300" x2="460" y2="300" stroke="#26313A" stroke-width="2"/>
  <g fill="#7AAEE3">
    <circle cx="110" cy="196" r="5"/>
    <circle cx="400" cy="196" r="5"/>
  </g>
  <line x1="115" y1="196" x2="395" y2="196" stroke="#7AAEE3" stroke-width="1.6" stroke-dasharray="1 0"/>
  <text x="255" y="188" font-size="11" fill="#99C6F3" text-anchor="middle">fixed path · L_FS constant · 18.32 km engineered hop</text>

  <!-- rain cell -->
  <g opacity="0.9">
    <ellipse cx="255" cy="120" rx="86" ry="30" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)"/>
    <g stroke="#AAB8C2" stroke-width="1.2" opacity="0.75">
      <line x1="215" y1="150" x2="207" y2="176"/>
      <line x1="240" y1="152" x2="232" y2="178"/>
      <line x1="265" y1="152" x2="257" y2="178"/>
      <line x1="290" y1="150" x2="282" y2="176"/>
    </g>
    <text x="255" y="124" font-size="11.5" fill="#F5F7FA" text-anchor="middle">rain cell</text>
    <line x1="345" y1="120" x2="420" y2="120" stroke="#AAB8C2" stroke-width="1.4" marker-end="url(#a4w)"/>
    <text x="385" y="108" font-size="10.5" fill="#AAB8C2" text-anchor="middle">translates</text>
  </g>

  <text x="40" y="336" font-size="11.5" fill="#AAB8C2">What varies: the atmosphere between two points that do not move.</text>
  <text x="40" y="356" font-size="11.5" fill="#AAB8C2">Ambiguity to resolve: <tspan fill="#F5F7FA">environmental cause or equipment cause?</tspan></text>

  <!-- RIGHT PANEL: LEO -->
  <rect x="510" y="20" width="470" height="360" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
  <text x="530" y="48" font-size="12" fill="#99C6F3" letter-spacing="0.08em">LEO / NTN</text>
  <text x="530" y="70" font-size="13.5" fill="#F5F7FA" font-weight="600">Changing infrastructure · changing propagation</text>

  <!-- orbit arc -->
  <path d="M545 210 Q 745 90 945 210" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <g>
    <g fill="rgba(127,227,240,0.18)" stroke="#99C6F3">
      <rect x="590" y="168" width="26" height="16" rx="3"/>
      <rect x="732" y="120" width="26" height="16" rx="3"/>
      <rect x="874" y="168" width="26" height="16" rx="3"/>
    </g>
    <g stroke="#99C6F3" stroke-width="1.2">
      <line x1="584" y1="176" x2="590" y2="176"/><line x1="616" y1="176" x2="622" y2="176"/>
      <line x1="726" y1="128" x2="732" y2="128"/><line x1="758" y1="128" x2="764" y2="128"/>
      <line x1="868" y1="176" x2="874" y2="176"/><line x1="900" y1="176" x2="906" y2="176"/>
    </g>
  </g>
  <text x="603" y="160" font-size="10" fill="#AAB8C2" text-anchor="middle">t₀</text>
  <text x="745" y="112" font-size="10" fill="#AAB8C2" text-anchor="middle">t₀+2 min</text>
  <text x="887" y="160" font-size="10" fill="#AAB8C2" text-anchor="middle">handover</text>

  <!-- terminal + gateway -->
  <line x1="530" y1="300" x2="960" y2="300" stroke="#26313A" stroke-width="2"/>
  <g stroke="#AAB8C2" stroke-width="2" fill="none">
    <path d="M690 300 L700 276 L710 300"/>
    <path d="M866 300 L876 276 L886 300"/>
  </g>
  <text x="700" y="318" font-size="10.5" fill="#AAB8C2" text-anchor="middle">terminal</text>
  <text x="876" y="318" font-size="10.5" fill="#AAB8C2" text-anchor="middle">gateway</text>

  <g stroke="#99C6F3" stroke-width="1.4">
    <line x1="700" y1="274" x2="603" y2="186"/>
    <line x1="700" y1="274" x2="745" y2="138" stroke-opacity="0.55"/>
    <line x1="700" y1="274" x2="887" y2="186" stroke-opacity="0.35" stroke-dasharray="4 3"/>
    <line x1="876" y1="274" x2="887" y2="186" stroke-opacity="0.35" stroke-dasharray="4 3"/>
  </g>
  <text x="545" y="262" font-size="10.5" fill="#99C6F3">elevation ε changes</text>
  <text x="545" y="276" font-size="10.5" fill="#99C6F3">continuously</text>

  <text x="530" y="336" font-size="11.5" fill="#AAB8C2">What varies: geometry, serving spacecraft, beam, gateway — <tspan fill="#F5F7FA">and</tspan> the atmosphere.</text>
  <text x="530" y="356" font-size="11.5" fill="#AAB8C2">Ambiguity to resolve: <tspan fill="#F5F7FA">is this a fault at all, or expected geometry?</tspan></text>

  <!-- shared band -->
  <rect x="20" y="404" width="960" height="152" rx="8" fill="rgba(122,174,227,0.07)" stroke="#5F98D1"/>
  <text x="40" y="430" font-size="12" fill="#7AAEE3" letter-spacing="0.08em">SHARED — ONE DECISION PIPELINE, APPLIED UNMODIFIED TO BOTH DOMAINS</text>

  <g>
    <g fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)">
      <rect x="40" y="448" width="150" height="40" rx="6"/>
      <rect x="222" y="448" width="150" height="40" rx="6"/>
      <rect x="404" y="448" width="150" height="40" rx="6"/>
      <rect x="586" y="448" width="150" height="40" rx="6"/>
      <rect x="768" y="448" width="192" height="40" rx="6"/>
    </g>
    <g font-size="12" fill="#F5F7FA" text-anchor="middle">
      <text x="115" y="473">signal</text>
      <text x="297" y="473">context</text>
      <text x="479" y="473">state</text>
      <text x="661" y="473">evidence</text>
      <text x="864" y="473">decision boundary</text>
    </g>
    <g stroke="#7AAEE3" stroke-width="1.5" marker-end="url(#a4)">
      <line x1="192" y1="468" x2="218" y2="468"/>
      <line x1="374" y1="468" x2="400" y2="468"/>
      <line x1="556" y1="468" x2="582" y2="468"/>
      <line x1="738" y1="468" x2="764" y2="468"/>
    </g>
  </g>
  <text x="40" y="516" font-size="11.5" fill="#AAB8C2">Same feature extractor, same metric set, same ordinal confidence scheme. What differs is not the method but the physics: the hypothesis cards, the</text>
  <text x="40" y="533" font-size="11.5" fill="#AAB8C2">discriminators available, and the timescales. Tested as H4 — neither domain required a bespoke pipeline.</text>
  <text x="40" y="550" font-size="11" fill="#8794A0">Conceptual. Not to scale. Modelled parameters shown for orientation only.</text>
</svg>
